name: README checks

on:
  push:
    branches: [main]
    paths: ["**.md", ".markdownlint-cli2.yaml", ".lycheeignore", ".github/workflows/readme-check.yml"]
  pull_request:
    paths: ["**.md", ".markdownlint-cli2.yaml", ".lycheeignore", ".github/workflows/readme-check.yml"]
  schedule:
    # Weekly, Monday 03:23 UTC: catches links and images that broke on their own.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  links:
    name: Links and images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2
        with:
          # 429 = rate limited by a badge/stats service, not a broken link.
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30
            --accept 200,429
            "**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
