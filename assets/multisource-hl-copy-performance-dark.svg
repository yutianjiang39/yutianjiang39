<text x="150" y="150" text-anchor="middle" font-weight="800" fill="url(#num)" letter-spacing="-2"><tspan font-size="64">8</tspan><tspan font-size="20" font-weight="600" fill="#3FB8AF" dx="8" letter-spacing="0">targets</tspan></text>
<text x="150.0" y="180.0" font-size="14" font-weight="500" fill="#9198A1" text-anchor="middle">Sources followed · 跟随来源</text>
