<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<title id="title">Multisource HL Copy · Performance · 性能</title>
<desc id="desc">Multisource HL Copy as one flow: up to 8 sources fan into the execution engine with signal bursts of 150 per second, and the engine submits to Hyperliquid with local submission latency of p50 14 ms and p99 23 ms over 1,765 mainnet orders. 3 targets have run about 144 hours live.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262D"/></pattern><linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6EDF3"/><stop offset="1" stop-color="#7CE0D6"/></linearGradient><linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3FB8AF" stop-opacity="0.2"/><stop offset="1" stop-color="#3FB8AF" stop-opacity="0.85"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#3FB8AF" stop-opacity="0.4"/><stop offset="1" stop-color="#3FB8AF" stop-opacity="0"/></radialGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3FB8AF"/></marker></defs>
