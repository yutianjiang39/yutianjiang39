<title id="title">Multisource HL Copy · Performance · 性能</title>
<desc id="desc">Multisource HL Copy performance: local submission p99 23 ms and p50 14 ms over 1,765 mainnet orders; two-source signal bursts of 150 per second in three 5-second bursts per run; up to 8 configurable targets converging into one engine; 3 targets run about 144 hours live.</desc>
