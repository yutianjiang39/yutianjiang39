<title id="title">Multisource HL Copy · Performance · 性能</title>
<desc id="desc">Multisource HL Copy: up to 8 source wallets are followed in parallel by a Rust execution engine that handles signal bursts of 150 per second and submits to Hyperliquid with local submission latency of p99 23 ms (p50 14 ms) over 1,765 mainnet orders.</desc>
