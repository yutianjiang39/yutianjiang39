<svg xmlns="http://www.w3.org/2000/svg" width="960" height="748" viewBox="0 0 960 748" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<title id="title">Hyperliquid Monitor architecture · 系统架构</title>
<desc id="desc">The official API, the official S3 archive and local JSON or CSV files feed a collector that deduplicates into a per-wallet SQLite cache. The cache feeds metrics and a mark-to-market rebuild. The rebuild is reconciled weekly against the official portfolio figures. Metrics and reconciliation produce an offline HTML report with CSV and audit files. A Textual TUI and CLI drive the collector and the report.</desc>
