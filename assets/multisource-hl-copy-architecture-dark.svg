<svg xmlns="http://www.w3.org/2000/svg" width="960" height="642" viewBox="0 0 960 642" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<title id="title">Multisource HL Copy architecture · 系统架构</title>
<desc id="desc">Source wallets send order and fill events to the Rust execution engine, which holds order lifecycle mirroring, position following and persistent state. The engine places, modifies and cancels orders on Hyperliquid and receives its own order and fill updates. A deterministic risk guard can pause, cancel or flatten. A Python control plane starts, stops and configures the engine. Engine and risk guard feed alerts and periodic reports.</desc>
